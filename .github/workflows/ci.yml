name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official MoonBit toolchain
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Check formatting
        if: matrix.target == 'wasm'
        run: moon fmt --check
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Build
        run: moon build --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Run MoonBit mail view demo
        run: moon run cmd/demo --target ${{ matrix.target }}
      - name: Bounded differential comparison
        if: matrix.target == 'wasm'
        run: python3 scripts/run_differential.py

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MoonBit for clean archive differential checks
        run: |
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Python adapter regression tests
        run: python3 -m unittest discover -s tests -p 'test*.py'
        env:
          PYTHONPATH: src
      - name: Independent state oracle
        run: python3 tests/verify.py --strict-structure
      - name: Runnable examples
        run: |
          python3 examples/replay_vectors.py
          python3 examples/codec_roundtrip.py
      - name: Build and check clean source archives
        run: |
          python3 scripts/build_source_archive.py --output-dir dist
          package_version=$(python3 -c 'from pathlib import Path; from scripts.build_source_archive import project_metadata; print(project_metadata(Path.cwd())[1])')
          python3 scripts/release_smoke_test.py "dist/moonjmap-${package_version}-src.tar.gz"
          python3 scripts/release_smoke_test.py "dist/moonjmap-${package_version}-src.zip"
      - name: Check Mooncakes package construction
        run: moon package
